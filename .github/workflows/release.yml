name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      bundle_model:
        description: 'Bundle offline Whisper model into installer'
        required: true
        type: boolean
        default: true
      model_name:
        description: 'Whisper model size/name to bundle'
        required: true
        type: string
        default: 'large-v3-turbo'

jobs:
  build:
    name: Build Windows Installer & Portable Package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress --timeout 600

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.1.1" }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Standalone Distribution & Installer
        shell: pwsh
        run: |
          $bundleArgs = if ("${{ github.event.inputs.bundle_model }}" -ne "false") { "--bundle-model" } else { "" }
          $modelName = if ("${{ github.event.inputs.model_name }}") { "${{ github.event.inputs.model_name }}" } else { "large-v3-turbo" }
          python scripts/build_dist.py $bundleArgs --model-name $modelName --version "${{ steps.get_version.outputs.version }}"

      - name: Rename Installer with Version
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          if (Test-Path "dist/installer/Dictatly-Setup.exe") {
            Move-Item "dist/installer/Dictatly-Setup.exe" "dist/installer/Dictatly-Setup-v$ver.exe" -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/Dictatly-Setup-v*.exe
            dist/Dictatly-v*.zip
          draft: false
          prerelease: false
          body: |
            ## Dictatly Release ${{ github.ref_name }}

            ### 🚀 Quick Downloads:
            - **`Dictatly-Setup-v${{ steps.get_version.outputs.version }}.exe` (Рекомендуется)** — Полноценный классический установщик Windows.
            - **`Dictatly-v${{ steps.get_version.outputs.version }}-Portable.zip`** — Портативная версия (распакуйте и запустите `Dictatly.exe`).

            > [!NOTE]
            > **Размер установщика (~1.8 ГБ):**
            > Установщик весит около 1.8 ГБ, поскольку содержит предобученную нейросеть Faster-Whisper (`large-v3-turbo`) и все библиотеки GPU/CPU ускорения.
            > Приложение готово к мгновенной работе на 100% автономно сразу после установки, без необходимости загрузки сторонних моделей из интернета.
