name: Release Publication

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Release Notes
        run: |
          cat << 'EOF' > release_notes.md
          # Dictatly 1.1.2

          Dictatly 1.1.2 is a core resilience and stability release focused on low-latency audio capture, Win32 input hook reliability, hardened text injection, and ASR hallucination elimination.

          ### Core Enhancements & Fixes

          - **Resilient Audio Input Pipeline:**
            - Cascading multi-tier device fallback (`device_index` -> persistent `device_name` -> system default -> any active input).
            - Dynamic sample rate negotiation probing 16 kHz, 44.1 kHz, and 48 kHz with high-precision linear interpolation resampling (`resample_audio`).
            - Stereo-to-mono downmixing in audio callback.
            - Automatic error notification in system tray on hardware disconnection or driver failure.

          - **Low-Level Keyboard Hook Watchdog:**
            - Integrated 3-second watchdog thread detecting silently detached `WH_KEYBOARD_LL` hooks caused by Windows `LowLevelHooksTimeout` (200ms) under system load.
            - Physical key polling via `GetAsyncKeyState` on every event, purging stuck modifiers (`VK_RCONTROL`, `VK_LSHIFT`, `VK_RETURN`) caused by missed `WM_KEYUP` during Alt-Tab, UAC, or lock screens.

          - **Text Injector Hardening:**
            - Added `KEYEVENTF_EXTENDEDKEY` (0x0001) flag for extended keys (`VK_RCONTROL`, `VK_RMENU`, `VK_RWIN`), ensuring clean modifier release before simulated `Ctrl+V`.
            - Active caret fallback now queries target window bounding rect (`GetWindowRect`), preventing HUD coordinate displacement on multi-monitor setups.

          - **ASR Silence & Hallucination Elimination:**
            - RMS acoustic energy threshold gate (`rms < 0.002`) skips inference and prevents model loading on background noise or accidental key taps.
            - Post-transcription sanitization filtering pure punctuation artifacts and hallucinated subtitle credits.

          - **Process Lifecycle & Logging:**
            - Single-instance mutex switched to session-local scope (`Local\Dictatly_SingleInstance_Mutex`).
            - Activation handoff opens the Settings window when launching a second instance.
            - Background rotating diagnostic logging to `%APPDATA%/Dictatly/dictatly.log`.

          ---

          ### Quick Install (PowerShell)

          Run in PowerShell (<kbd>Win</kbd> + <kbd>R</kbd> → `powershell`):

          ```powershell
          irm https://raw.githubusercontent.com/21dkkk/Dictatly/main/install.ps1 | iex
          ```

          ---

          ### Developer Setup

          ```powershell
          git clone https://github.com/21dkkk/Dictatly.git
          cd Dictatly
          python -m venv venv
          .\venv\Scripts\activate
          pip install -r requirements.txt
          python main.py
          ```
          EOF

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Updating release for tag: $TAG"

          # Delete pre-existing release to ensure outdated 1.8GB descriptions and stale assets are replaced completely
          gh release delete "$TAG" --yes || true

          # Create fresh release with clean, accurate description
          gh release create "$TAG" install.ps1 \
            --title "Dictatly $TAG" \
            --notes-file release_notes.md
