name: Release Publication

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Release Notes
        run: |
          cat << 'EOF' > release_notes.md
          # Dictatly 1.1.3

          Dictatly 1.1.3 is a critical stability and performance release addressing the infinite transcribing HUD freeze, dynamic cuBLAS runtime loading for NVIDIA RTX GPUs, model context isolation, safe CPU fallback, and offline snapshot startup.

          ### Core Enhancements & Fixes

          - **Eliminated Infinite Transcribing HUD Freeze:**
            - Resolved an unrecoverable CTranslate2 deadlock caused by repeated dictation attempts after a dynamic CUDA loading failure.
            - Integrated a 20-second fail-safe watchdog timer in `_finish_dictation`, guaranteeing the floating HUD widget always returns to `HUDState.IDLE` even during unexpected driver stalls or background delays.

          - **Dynamic NVIDIA cuBLAS Discovery & Multi-Venv Path Resolution:**
            - Added `nvidia-cublas-cu12` dependency and broadened `setup_cuda_paths()` and `setup_cuda_dll_path()` to scan all virtual environments (`sys.prefix`, `sys.base_prefix`, workspace `venv`, and `%LOCALAPPDATA%\Dictatly\venv`).
            - Added preflight verification for both `cublas64_12.dll` and `cublasLt64_12.dll` via `ctypes.CDLL()` before committing to CUDA mode.

          - **Corrupted Model Context Isolation & Clean CPU Fallback:**
            - Discards broken CTranslate2 model instances (`self._model = None`) immediately when a CUDA exception occurs, preventing deadlocks on subsequent dictations.
            - Transparently falls back to CPU `int8` quantization with automatic model recreation.

          - **Direct Offline Model Snapshot Loading:**
            - Implemented `resolve_local_model_path()` to locate direct local snapshot directories containing `model.bin`.
            - Completely bypasses Hugging Face network queries during startup and dictation, achieving **1.5s cold start** and offline resilience.

          - **Named Pipe IPC & Launcher Detachment:**
            - Added explicit `"shutdown"` command to named pipe listener on exit, ensuring immediate socket unblocking during restart.
            - Fixed Win32 mutex release null-check and verified clean launcher handoff with `UseShellExecute = true`.
            - Added timer cleanup in `QuickHistoryWindow.closeEvent` and `hideEvent` to ensure 0.0% idle CPU usage.

          - **Dual-Environment Synchronization:**
            - Fully synchronized workspace binaries, source modules, and dependencies with `%LOCALAPPDATA%\Dictatly`.
            - Updated Desktop, Start Menu, and Startup shortcuts to ensure all launch points run the latest 1.1.3 build.

          ---

          ### Quick Install (PowerShell)

          Run in PowerShell (<kbd>Win</kbd> + <kbd>R</kbd> → `powershell`):

          ```powershell
          irm https://raw.githubusercontent.com/21dkkk/Dictatly/main/install.ps1 | iex
          ```

          ---

          ### Developer Setup

          ```powershell
          git clone https://github.com/21dkkk/Dictatly.git
          cd Dictatly
          python -m venv venv
          .\venv\Scripts\activate
          pip install -r requirements.txt
          python main.py
          ```
          EOF

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Updating release for tag: $TAG"

          # Delete pre-existing release to ensure outdated 1.8GB descriptions and stale assets are replaced completely
          gh release delete "$TAG" --yes || true

          # Create fresh release with clean, accurate description
          gh release create "$TAG" install.ps1 \
            --title "Dictatly $TAG" \
            --notes-file release_notes.md
